<div class="lyria-container">
  <h1>Lyria Audio Generation</h1>
  <form (ngSubmit)="generateAudio()">
    <mat-form-field appearance="fill">
      <mat-label>Prompt</mat-label>
      <textarea matInput [(ngModel)]="prompt" name="prompt" required></textarea>
    </mat-form-field>
    <mat-form-field appearance="fill">
      <mat-label>Negative Prompt</mat-label>
      <input matInput [(ngModel)]="negativePrompt" name="negativePrompt">
    </mat-form-field>
    <mat-form-field appearance="fill">
      <mat-label>Seed</mat-label>
      <input matInput type="number" [(ngModel)]="seed" name="seed">
    </mat-form-field>
    <mat-form-field appearance="fill">
      <mat-label>Sample Count</mat-label>
      <input matInput type="number" [(ngModel)]="sampleCount" name="sampleCount">
    </mat-form-field>
    <button mat-raised-button color="primary" type="submit" [disabled]="isLoading">
      <span *ngIf="!isLoading">Generate</span>
      <span *ngIf="isLoading">Generating...</span>
    </button>
  </form>
  <div *ngIf="audioUrl">
    <h2>Generated Audio</h2>
    <audio controls>
      <source [src]="audioUrl" type="audio/wav">
      Your browser does not support the audio element.
    </audio>
  </div>
</div>
